services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-telecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telecom_pw}
      POSTGRES_DB: ${POSTGRES_DB:-telecom}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-telecom} -d $${POSTGRES_DB:-telecom}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides whatever DATABASE_URL is in .env so the API always talks to the compose database.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-telecom}:${POSTGRES_PASSWORD:-telecom_pw}@db:5432/${POSTGRES_DB:-telecom}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
